<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farida's Birthday Memory</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6f2, #e9ddff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #40243b;
      overflow: hidden;
    }
    .card {
      width: min(90%, 620px);
      padding: 45px 30px;
      text-align: center;
      background: rgba(255,255,255,.78);
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(70,40,80,.18);
      backdrop-filter: blur(8px);
      position: relative;
      z-index: 2;
    }
    .emoji { font-size: 58px; }
    h1 { font-size: clamp(38px, 9vw, 70px); margin: 12px 0; }
    h2 { font-weight: 500; margin: 8px 0 24px; }
    .date {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: #fff;
      font-size: 20px;
      font-weight: bold;
    }
    p { line-height: 1.7; font-size: 17px; }
    .heart { font-size: 28px; margin-top: 20px; }
    .bubble {
      position: fixed;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,.6);
      animation: float 8s linear infinite;
    }
    @keyframes float {
      from { transform: translateY(110vh) scale(.7); opacity: 0; }
      20% { opacity: 1; }
      to { transform: translateY(-20vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="bubble" style="left:8%;animation-delay:0s"></div>
  <div class="bubble" style="left:25%;animation-delay:2s"></div>
  <div class="bubble" style="left:48%;animation-delay:4s"></div>
  <div class="bubble" style="left:70%;animation-delay:1s"></div>
  <div class="bubble" style="left:88%;animation-delay:5s"></div>

  <main class="card">
    <div class="emoji">🎂✨</div>
    <h1>Farida</h1>
    <h2>A Little Birthday Memory</h2>
    <div class="date">January 3 🎉</div>
    <p>
      A special day for a special person.<br>
      May this birthday bring Farida happiness, beautiful memories,
      and many wonderful moments in the year ahead.
    </p>
    <div class="heart">💖 🎈 💐</div>
  </main>
</body>
</html>
